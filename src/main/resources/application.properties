spring.application.name=cross-docking
server.port=8080

# ===== SQL Server =====
spring.datasource.url=jdbc:sqlserver://localhost:1450;databaseName=CrossDocking;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
# Mat khau KHONG luu tren GitHub: lay tu bien moi truong DB_PASSWORD,
# hoac tu tep application-secret.properties (chi co tren may, da bi .gitignore loai ra)
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:classpath:application-secret.properties

# Tu tao/cap nhat bang
spring.jpa.hibernate.ddl-auto=update
# Luu chuoi dang NVARCHAR de khong loi tieng Viet
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.servlet.session.timeout=60m