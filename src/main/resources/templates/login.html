<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập · Cross-Docking</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 1rem; background: #f3f5f8; min-height: 100vh; }
        .login-card { max-width: 420px; width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
                      box-shadow: 0 1px 3px rgba(16, 24, 40, .05); }
        .logo { width: 48px; height: 48px; border-radius: 12px; background: #1a73e8; color: #fff;
                display: grid; place-items: center; font-size: 1.4rem; margin: 0 auto .85rem; }
        h1 { font-size: 1.4rem; font-weight: 600; color: #111827; }
        .form-label { color: #374151; font-weight: 500; }
        .form-control { border-color: #d9dee5; border-radius: 7px; padding: .6rem .8rem; }
        .form-control:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26, 115, 232, .15); }
        .eye-btn { border-color: #d9dee5; color: #6b7280; background: #fff; }
        .eye-btn:hover { background: #f3f4f6; color: #111827; border-color: #d9dee5; }
        .btn-login { background: #1a73e8; border-color: #1a73e8; color: #fff; font-weight: 500; border-radius: 7px; padding: .6rem; }
        .btn-login:hover { background: #1765cc; border-color: #1765cc; color: #fff; }
        .alert { border-radius: 8px; font-size: .9rem; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<div class="login-card p-4 p-md-5">
    <div class="logo"><i class="bi bi-arrow-left-right"></i></div>
    <h1 class="text-center mb-1">Cross-Dock Portal</h1>
    <p class="text-center text-muted mb-4">Cổng quản lý kho trung chuyển</p>

    <div class="alert alert-danger py-2" th:if="${param.error}">Sai tên đăng nhập hoặc mật khẩu.</div>
    <div class="alert alert-danger py-2" th:if="${param.locked}">Tài khoản đã bị khóa do nhập sai mật khẩu 5 lần. Liên hệ quản trị viên.</div>
    <div class="alert alert-warning py-2" th:if="${param.disabled}">Tài khoản đã bị vô hiệu hóa.</div>
    <div class="alert alert-success py-2" th:if="${param.logout}">Bạn đã đăng xuất.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-4">
            <label class="form-label">Mật khẩu</label>
            <div class="input-group">
                <input type="password" name="password" id="password" class="form-control" required>
                <button type="button" class="btn eye-btn" id="togglePw" tabindex="-1" title="Hiện / ẩn mật khẩu">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>
        <button class="btn btn-login w-100">Đăng nhập</button>
    </form>
    <p class="text-muted small text-center mt-4 mb-0">Tài khoản do quản trị viên cấp – không có đăng ký công khai.</p>
</div>
<script>
    document.getElementById('togglePw').addEventListener('click', function () {
        var inp = document.getElementById('password');
        var show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        this.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        inp.focus();
    });
</script>
</body>
</html>
