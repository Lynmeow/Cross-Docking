<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} · Cross-Docking|">Cross-Docking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        /* ================= Màu & chữ chung ================= */
        :root {
            --brand: #1a73e8;
            --brand-hover: #1765cc;
            --brand-soft: #e8f0fe;
            --line: #e5e7eb;
            --muted: #6b7280;
            --ink: #111827;
            --sidebar-w: 236px;
            --topbar-h: 60px;
            --bs-body-font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            --bs-body-font-size: 1rem;              /* 16px */
            --bs-body-line-height: 1.55;
            --bs-body-color: #1f2937;
            --bs-body-bg: #f3f5f8;
            --bs-border-color: #e5e7eb;
            --bs-primary: #1a73e8;
            --bs-primary-rgb: 26, 115, 232;
            --bs-link-color: #1a73e8;
            --bs-link-color-rgb: 26, 115, 232;
            --bs-link-hover-color: #1765cc;
        }
        body { background: var(--bs-body-bg); }
        a { text-decoration: none; }
        h3, h4 { font-size: 1.375rem; font-weight: 600; color: var(--ink); margin-bottom: 1rem !important; }
        h6 { font-size: 1rem; font-weight: 600; }
        .text-muted { color: var(--muted) !important; }
        .small, small { font-size: .875rem !important; }            /* chữ phụ 14px */
        .fs-6 { font-size: .9375rem !important; }

        /* ================= Khung: menu trái + thanh trên ================= */
        .app-sidebar {
            position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
            background: #fff; border-right: 1px solid var(--line);
            display: flex; flex-direction: column; z-index: 1030;
        }
        .app-brand {
            height: var(--topbar-h); display: flex; align-items: center; gap: .7rem; padding: 0 1.25rem;
            font-weight: 700; font-size: 1.125rem; color: var(--ink); border-bottom: 1px solid #eef0f3;
        }
        .app-brand .logo {
            width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: #fff;
            display: grid; place-items: center; font-size: 1.05rem;
        }
        .app-menu { padding: .5rem .75rem 1rem; overflow-y: auto; flex: 1; }
        .app-menu .menu-label {
            font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;
            color: #9ca3af; font-weight: 600; padding: 1rem .75rem .4rem;
        }
        .app-menu a {
            display: flex; align-items: center; gap: .75rem; padding: .6rem .75rem; margin-bottom: 2px;
            border-radius: 7px; color: #374151; font-size: .975rem; font-weight: 500;
        }
        .app-menu a .bi { font-size: 1.1rem; width: 20px; text-align: center; color: #6b7280; }
        .app-menu a:hover { background: #f3f4f6; }
        .app-menu a.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
        .app-menu a.active .bi { color: var(--brand); }

        .app-topbar {
            position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: var(--topbar-h); z-index: 1020;
            background: #fff; border-bottom: 1px solid var(--line);
            display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; padding: 0 1.5rem;
        }
        .page-title { font-size: 1.125rem; font-weight: 600; color: var(--ink); white-space: nowrap; }
        .app-topbar .scan .form-control { width: 280px; background: #f8fafc; }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%; background: var(--brand-soft); color: var(--brand);
            display: grid; place-items: center; font-weight: 600; font-size: .95rem;
        }
        .user-name { font-weight: 600; color: var(--ink); line-height: 1.2; font-size: .95rem; }
        .user-role { font-size: .8125rem; color: var(--muted); }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 7px; border: 1px solid var(--line); background: #fff;
            display: grid; place-items: center; color: #4b5563; font-size: 1.05rem;
        }
        .icon-btn:hover { background: #f3f4f6; color: var(--ink); }

        /* Nội dung: chừa chỗ cho menu trái, KHÔNG tràn ngang */
        nav.app-shell ~ main {
            margin-left: var(--sidebar-w);
            width: auto !important;
            max-width: none;
            padding: calc(var(--topbar-h) + 1.5rem) 1.5rem 2.5rem !important;
        }

        @media (max-width: 991.98px) {
            .app-sidebar { position: static; width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
            .app-menu { display: flex; flex-wrap: wrap; gap: 4px; padding: .5rem; }
            .app-menu .menu-label { display: none; }
            .app-topbar { position: static; height: auto; flex-wrap: wrap; padding: .75rem 1rem; }
            .app-topbar .scan .form-control { width: 100%; }
            nav.app-shell ~ main { margin-left: 0; padding: 1rem !important; }
        }

        /* ================= Khoảng cách giữa các khối ================= */
        .row.g-4 { --bs-gutter-x: 1.25rem; --bs-gutter-y: 1.25rem; }
        .row.g-3 { --bs-gutter-x: 1rem; --bs-gutter-y: 1rem; }
        .row.g-2 { --bs-gutter-x: .75rem; --bs-gutter-y: .75rem; }
        .mb-4 { margin-bottom: 1.25rem !important; }
        .mb-3 { margin-bottom: 1rem !important; }

        /* ================= Thẻ (card) ================= */
        .card { border: 1px solid var(--line); border-radius: 10px; }
        .shadow-sm { box-shadow: 0 1px 3px rgba(16, 24, 40, .05) !important; }
        .card-header {
            background: #fff; border-bottom: 1px solid #eef0f3; padding: .9rem 1.25rem;
            font-weight: 600; font-size: 1.0625rem; color: var(--ink);
            border-radius: 10px 10px 0 0 !important;
        }
        .card-header .bi { color: var(--brand); margin-right: .25rem; }
        .card-body { padding: 1.15rem 1.25rem; }
        .card-footer { background: #fff; border-top: 1px solid #eef0f3; padding: .85rem 1.25rem; }
        .border-danger, .border-warning { border-color: var(--line) !important; }
        dl.row dt { font-weight: 500; color: var(--muted); }
        dl.row dd { color: var(--ink); }

        /* ================= Bảng ================= */
        .table { --bs-table-hover-bg: #f5f9ff; margin-bottom: 0; font-size: .9375rem; }
        .table > thead th, .table-light th {
            background: #f5f7fa !important; color: #4b5563; font-weight: 600; font-size: .875rem;
            border-bottom: 1px solid var(--line); white-space: nowrap;
        }
        .table td, .table th { vertical-align: middle; padding: .7rem .9rem; border-color: #eef0f3; }
        .table-sm td, .table-sm th { padding: .55rem .75rem; }

        /* ================= Nút: chỉ dùng xanh dương + xám ================= */
        .btn { border-radius: 7px; font-weight: 500; font-size: .9375rem; padding: .45rem .95rem; }
        .btn-sm { font-size: .875rem; padding: .35rem .75rem; }
        .btn-primary, .btn-success, .btn-warning, .btn-dark, .btn-info {
            --bs-btn-color: #fff; --bs-btn-bg: var(--brand); --bs-btn-border-color: var(--brand);
            --bs-btn-hover-color: #fff; --bs-btn-hover-bg: var(--brand-hover); --bs-btn-hover-border-color: var(--brand-hover);
            --bs-btn-active-color: #fff; --bs-btn-active-bg: #155ab6; --bs-btn-active-border-color: #155ab6;
            --bs-btn-disabled-color: #fff; --bs-btn-disabled-bg: #9cc0f5; --bs-btn-disabled-border-color: #9cc0f5;
        }
        .btn-outline-primary {
            --bs-btn-color: var(--brand); --bs-btn-border-color: var(--brand);
            --bs-btn-hover-color: #fff; --bs-btn-hover-bg: var(--brand); --bs-btn-hover-border-color: var(--brand);
            --bs-btn-active-color: #fff; --bs-btn-active-bg: var(--brand); --bs-btn-active-border-color: var(--brand);
        }
        .btn-outline-secondary, .btn-outline-dark, .btn-outline-light, .btn-outline-warning {
            --bs-btn-color: #374151; --bs-btn-bg: #fff; --bs-btn-border-color: #d1d5db;
            --bs-btn-hover-color: var(--ink); --bs-btn-hover-bg: #f3f4f6; --bs-btn-hover-border-color: #d1d5db;
            --bs-btn-active-color: var(--ink); --bs-btn-active-bg: #e5e7eb; --bs-btn-active-border-color: #d1d5db;
        }
        .btn-outline-danger {
            --bs-btn-color: #dc2626; --bs-btn-border-color: #f3b4b4;
            --bs-btn-hover-color: #fff; --bs-btn-hover-bg: #dc2626; --bs-btn-hover-border-color: #dc2626;
        }

        /* ================= Ô nhập, checkbox, phân trang ================= */
        .form-control, .form-select { border-color: #d9dee5; border-radius: 7px; font-size: .9375rem; padding: .5rem .75rem; }
        .form-control-sm, .form-select-sm { font-size: .875rem; padding: .4rem .65rem; }
        .form-select { padding-right: 2.25rem; background-position: right .7rem center; }
        .form-select-sm { padding-right: 2rem; background-position: right .6rem center; }
        .input-group-text { border-color: #d9dee5; background: #f8fafc; color: var(--muted); font-size: .9375rem; }
        .input-group-sm > .input-group-text { font-size: .875rem; }
        .form-control:focus, .form-select:focus {
            border-color: var(--brand); box-shadow: 0 0 0 3px rgba(26, 115, 232, .15);
        }
        .form-check-input { width: 1.1em; height: 1.1em; margin-top: .2em; }
        .form-check-input:checked { background-color: var(--brand); border-color: var(--brand); }
        .form-check-input:focus { box-shadow: 0 0 0 3px rgba(26, 115, 232, .15); }
        .form-check-label { font-size: .9375rem; }
        .form-label { color: #374151; font-weight: 500; font-size: .9375rem; margin-bottom: .35rem; }
        .page-link { color: var(--brand); }
        .page-item.active .page-link { background: var(--brand); border-color: var(--brand); }

        /* ================= Nhãn trạng thái: màu pastel nhạt ================= */
        .badge { font-weight: 500; font-size: .8125rem; padding: .4em .65em; border-radius: 5px; }
        .badge.text-bg-success   { background: #e7f6ec !important; color: #15803d !important; }
        .badge.text-bg-warning   { background: #fff4e5 !important; color: #b45309 !important; }
        .badge.text-bg-info      { background: #e8f1fd !important; color: #1a56db !important; }
        .badge.text-bg-primary   { background: #eef2ff !important; color: #4338ca !important; }
        .badge.text-bg-danger    { background: #fdecec !important; color: #c62828 !important; }
        .badge.text-bg-dark      { background: #eceff3 !important; color: #374151 !important; }
        .badge.text-bg-secondary { background: #f1f3f5 !important; color: #6b7280 !important; }
        .badge.text-bg-light     { background: #f8fafc !important; color: #374151 !important; }

        /* ================= Số liệu tổng quan ================= */
        .stat { font-size: 1.85rem; font-weight: 700; line-height: 1.2; margin-top: .15rem; }
        .stat[class*="text-"] { color: var(--ink) !important; }

        /* ================= Thông báo ================= */
        .alert { border-radius: 8px; font-size: .9375rem; padding: .75rem 1rem; }
        .alert-success { background: #e7f6ec; border-color: #c6e9d1; color: #166534; }
        .alert-danger  { background: #fdecec; border-color: #f7c9c9; color: #991b1b; }
        .alert-warning { background: #fff7ea; border-color: #fde3b8; color: #92400e; }
        .list-group-item { padding: .75rem 1.25rem; }

        .hash { font-family: ui-monospace, Consolas, monospace; font-size: .78rem; color: #9ca3af; }
    </style>
</head>
<body>

<nav th:fragment="nav(active)" class="app-shell">
    <!-- ===== Menu trái ===== -->
    <aside class="app-sidebar">
        <a class="app-brand" th:href="@{/}">
            <span class="logo"><i class="bi bi-arrow-left-right"></i></span>
            <span>Cross-Dock</span>
        </a>
        <div class="app-menu">
            <!-- Quản lý kho: điều phối -->
            <th:block th:if="${isManager}">
                <div class="menu-label">Điều phối</div>
                <a th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/dashboard}"><i class="bi bi-grid"></i> Tổng quan</a>
                <a th:classappend="${active == 'docks'} ? 'active'" th:href="@{/docks}"><i class="bi bi-door-open"></i> Cửa nhập/xuất</a>
                <a th:classappend="${active == 'trips'} ? 'active'" th:href="@{/trips}"><i class="bi bi-calendar-week"></i> Lịch xe</a>
            </th:block>

            <!-- Nhân viên vận hành (quản lý thấy ở chế độ giám sát) -->
            <th:block th:if="${isOps}">
                <div class="menu-label" th:text="${isManager} ? 'Giám sát vận hành' : 'Vận hành'">Vận hành</div>
                <a th:if="${canViewInbound}" th:classappend="${active == 'inbound'} ? 'active'" th:href="@{/inbound}"><i class="bi bi-box-arrow-in-down"></i> Inbound</a>
                <a th:if="${canViewOutbound}" th:classappend="${active == 'outbound'} ? 'active'" th:href="@{/outbound}"><i class="bi bi-truck"></i> Outbound</a>
                <a th:classappend="${active == 'pallets'} ? 'active'" th:href="@{/pallets}"><i class="bi bi-boxes"></i> Pallet</a>
                <a th:if="${canInbound}" th:classappend="${active == 'labels'} ? 'active'" th:href="@{/labels}"><i class="bi bi-upc-scan"></i> In tem pallet</a>
                <a th:classappend="${active == 'incidents'} ? 'active'" th:href="@{/incidents}"><i class="bi bi-exclamation-triangle"></i> Ngoại lệ</a>
            </th:block>

            <!-- Quản trị -->
            <th:block th:if="${isAdmin or isManager}">
                <div class="menu-label">Quản trị</div>
                <a th:if="${isAdmin}" th:classappend="${active == 'users'} ? 'active'" th:href="@{/admin/users}"><i class="bi bi-people"></i> Tài khoản</a>
                <a th:classappend="${active == 'audit'} ? 'active'" th:href="@{/audit}"><i class="bi bi-journal-text"></i> Nhật ký hoạt động</a>
            </th:block>
        </div>
    </aside>

    <!-- ===== Thanh trên ===== -->
    <header class="app-topbar">
        <div class="d-flex align-items-center gap-4">
            <div class="page-title" th:switch="${active}">
                <span th:case="'dashboard'">Tổng quan</span>
                <span th:case="'docks'">Cửa nhập / xuất</span>
                <span th:case="'trips'">Lịch xe</span>
                <span th:case="'inbound'">Khu vực Inbound</span>
                <span th:case="'outbound'">Khu vực Outbound</span>
                <span th:case="'pallets'">Pallet</span>
                <span th:case="'labels'">In tem pallet</span>
                <span th:case="'incidents'">Ngoại lệ chuyển tải</span>
                <span th:case="'users'">Quản lý tài khoản</span>
                <span th:case="'audit'">Nhật ký hoạt động</span>
                <span th:case="*"></span>
            </div>
            <form th:if="${isOps}" th:action="@{/pallets/scan}" method="get" class="scan m-0">
                <div class="input-group input-group-sm">
                    <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                    <input name="code" class="form-control" placeholder="Quét hoặc nhập mã pallet…" autocomplete="off" required>
                </div>
            </form>
        </div>

        <div class="d-flex align-items-center gap-2" th:if="${me != null}">
            <div class="d-flex align-items-center gap-2 me-2">
                <div class="avatar"
                     th:text="${#strings.toUpperCase(me.fullName.substring(me.fullName.lastIndexOf(' ') + 1, me.fullName.lastIndexOf(' ') + 2))}">A</div>
                <div>
                    <div class="user-name" th:text="${me.fullName}"></div>
                    <div class="user-role" th:text="${me.role.label}"></div>
                </div>
            </div>
            <a class="icon-btn" th:href="@{/change-password}" title="Đổi mật khẩu"><i class="bi bi-key"></i></a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="icon-btn" title="Đăng xuất"><i class="bi bi-box-arrow-right"></i></button>
            </form>
        </div>
    </header>
</nav>

<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /* Nút con mắt hiện/ẩn mật khẩu cho mọi ô password */
        document.querySelectorAll('input[type=password]').forEach(function (inp) {
            var wrap = document.createElement('div');
            wrap.className = 'input-group';
            inp.parentNode.insertBefore(wrap, inp);
            wrap.appendChild(inp);
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-outline-secondary';
            btn.tabIndex = -1;
            btn.title = 'Hiện / ẩn mật khẩu';
            btn.innerHTML = '<i class="bi bi-eye"></i>';
            btn.addEventListener('click', function () {
                var show = inp.type === 'password';
                inp.type = show ? 'text' : 'password';
                btn.innerHTML = show ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
                inp.focus();
            });
            wrap.appendChild(btn);
        });
    </script>
</th:block>
</body>
</html>
