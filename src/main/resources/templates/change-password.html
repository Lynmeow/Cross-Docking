<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đổi mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('')}"></nav>
<main class="container px-4 pb-5" style="max-width: 520px">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="alert alert-warning" th:if="${me != null and me.mustChangePassword}">
        <i class="bi bi-shield-lock"></i> Bạn đang dùng mật khẩu tạm do quản trị viên cấp – hãy đổi mật khẩu để tiếp tục.
    </div>
    <div class="card shadow-sm">
        <div class="card-header">Đổi mật khẩu</div>
        <div class="card-body">
            <form th:action="@{/change-password}" method="post">
                <div class="mb-2"><label class="form-label">Mật khẩu hiện tại</label><input type="password" name="currentPassword" class="form-control" required></div>
                <div class="mb-2"><label class="form-label">Mật khẩu mới</label><input type="password" name="newPassword" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Nhập lại mật khẩu mới</label><input type="password" name="confirmPassword" class="form-control" required></div>
                <div class="small text-muted mb-3">Tối thiểu 8 ký tự, gồm cả chữ và số.</div>
                <button class="btn btn-primary w-100">Lưu mật khẩu</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
